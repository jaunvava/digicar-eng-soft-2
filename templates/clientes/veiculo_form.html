{% extends 'base.html' %}{% block title %}{{ titulo }}{% endblock %}{% block content %}<div class="page-header"><h1 class="page-title">{{ titulo }}</h1></div><form method="post" class="card p-4">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label-custom">Cliente *</label><select name="cliente" required class="form-control-custom">{% for c in clientes %}<option value="{{ c.pk }}" {% if veiculo.cliente_id == c.pk %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label-custom">Placa *</label><input name="placa" required class="form-control-custom" value="{{ veiculo.placa|default:'' }}"></div><div class="col-md-3"><label class="form-label-custom">Modelo *</label><input name="modelo" required class="form-control-custom" value="{{ veiculo.modelo|default:'' }}"></div><div class="col-md-3"><label class="form-label-custom">Marca</label><input name="marca" class="form-control-custom" value="{{ veiculo.marca|default:'' }}"></div><div class="col-md-2"><label class="form-label-custom">Ano</label><input type="number" name="ano" class="form-control-custom" value="{{ veiculo.ano|default:'' }}"></div><div class="col-md-3"><label class="form-label-custom">Cor</label><input name="cor" class="form-control-custom" value="{{ veiculo.cor|default:'' }}"></div><div class="col-md-4"><label class="form-label-custom">Chassi</label><input name="chassi" class="form-control-custom" value="{{ veiculo.chassi|default:'' }}"></div><div class="col-12"><label class="form-label-custom">Observações</label><textarea name="observacoes" class="form-control-custom">{{ veiculo.observacoes|default:'' }}</textarea></div></div><div class="mt-3"><button class="btn-primary-custom">Salvar</button></div></form>{% endblock %}
