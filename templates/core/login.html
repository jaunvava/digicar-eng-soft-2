{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | DigiCAR</title>
  <meta name="description" content="Acesse o DigiCAR — Sistema de Ordens de Serviço">
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <!-- Brand -->
    <div class="login-brand">
      <h1>DigiCAR</h1>
      <p>Sistema de Ordens de Serviço</p>
    </div>

    <!-- Erros -->
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-danger mb-3" style="border-radius: 5px;font-size:13px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;">
          <i class="bi bi-exclamation-triangle me-2"></i>{{ msg }}
        </div>
      {% endfor %}
    {% endif %}

    <!-- Formulário -->
    <form method="POST" action="{% url 'core:login' %}">
      {% csrf_token %}

      <!-- Código da Empresa -->
      <div class="login-form-group">
        <label for="codigo_empresa">Código da Empresa</label>
        <div class="input-wrapper">
          <i class="bi bi-building input-icon"></i>
          <input type="text" id="codigo_empresa" name="codigo_empresa"
                 placeholder="Ex: 001"
                 value="{{ request.POST.codigo_empresa }}"
                 required autocomplete="off"
                 style="text-transform:uppercase;">
        </div>
      </div>

      <!-- Usuário -->
      <div class="login-form-group">
        <label for="username">Usuário</label>
        <div class="input-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input type="text" id="username" name="username"
                 value="{{ request.POST.username }}"
                 required autocomplete="username">
        </div>
      </div>

      <!-- Senha -->
      <div class="login-form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper" style="position:relative;">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" id="password" name="password"
                 required autocomplete="current-password">
          <button type="button" onclick="togglePass()" id="togglePassBtn"
                  style="position:absolute;right:14px;top:50%;transform:translateY(-50%);
                         background:transparent;border:none;color:rgba(255,255,255,.4);
                         cursor:pointer;font-size:15px;padding:0;">
            <i class="bi bi-eye" id="passIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span id="loginText">Entrar</span>
        <i class="bi bi-arrow-right ms-2" id="loginArrow"></i>
      </button>
    </form>

    <!-- Footer do card -->
    <div style="text-align:center;margin-top:24px;">
      <p style="font-size:12px;color:rgba(255,255,255,.3);">
        Acesso restrito. Solicite credenciais ao administrador.
      </p>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function togglePass() {
    const inp = document.getElementById('password');
    const icon = document.getElementById('passIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'bi bi-eye';
    }
  }

  // Uppercase código empresa
  document.getElementById('codigo_empresa').addEventListener('input', function() {
    this.value = this.value.toUpperCase();
  });

  // Loading state on submit
  document.querySelector('form').addEventListener('submit', function() {
    const btn = document.getElementById('loginBtn');
    document.getElementById('loginText').textContent = 'Entrando...';
    document.getElementById('loginArrow').className = 'bi bi-arrow-repeat ms-2 spin';
    btn.style.opacity = '0.8';
  });
</script>
<style>
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin .7s linear infinite; }
</style>
</body>
</html>
